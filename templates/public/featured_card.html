{% with figure=publication.public_figures.0 %}<article class="featured-card"><a class="featured-thumb" href="{{ publication.page_name }}" tabindex="-1" aria-hidden="true"><img src="{{ figure.src }}" alt="" loading="lazy"></a><div class="featured-body"><p class="meta-line">{{ publication.year }}{% if publication.journal %} · <span lang="en">{{ publication.journal }}</span>{% endif %}</p><h3 lang="en"><a href="{{ publication.page_name }}">{{ publication.title }}</a></h3><a class="text-link" href="{{ publication.page_name }}" aria-label="成果详情：{{ publication.title }}">成果详情 →</a></div></article>{% endwith %}
