<article class="resource-card" data-kind="{{ resource.kind }}" data-disease="{{ resource.disease }}" data-search="{{ resource.title }} {{ resource.english }} {{ resource.kind }} {{ resource.disease }} {{ resource.year }} {{ resource.version_label }} {{ resource.journal }}">
<a class="resource-open" href="{{ resource.document.url }}" target="_blank" rel="noopener" aria-label="阅读：{{ resource.title }}（新窗口打开 PDF）">
<div class="resource-cover">{% if resource.cover %}<img src="{{ resource.cover.url }}" alt="{{ resource.title }}首页" loading="lazy">{% else %}<span class="cover-placeholder">PDF<br><small>{{ resource.kind }}</small></span>{% endif %}<span class="file-label">PDF</span></div>
<div class="resource-copy"><p class="resource-tags"><span>{{ resource.kind }}</span><span>{{ resource.disease }}</span></p><h3>{{ resource.title }}</h3><p class="resource-version">{{ resource.version_label|default:resource.year }}</p><p class="resource-source">{{ resource.journal }}</p></div></a>
<div class="resource-actions"><span>{{ resource.pages }} 页 · {{ resource.megabytes|floatformat:1 }} MB</span><a href="{{ resource.document.url }}" target="_blank" rel="noopener">阅读原文 ↗</a><a href="{{ resource.document.url }}" download="{{ resource.download_name }}">下载 ↓</a></div></article>
