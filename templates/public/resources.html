{% extends "public/base.html" %}{% block content %}{% include "public/intro.html" %}
<section class="container section"><form id="resource-filters" role="search" aria-label="检索学习资料"><label class="search-field">检索资料<input type="search" id="resource-search" placeholder="搜索标题、疾病或年份" autocomplete="off"></label><label>资料类型<select id="resource-kind"><option value="">全部类型</option>{% for kind in resource_kinds %}<option value="{{ kind }}">{{ kind }}</option>{% endfor %}</select></label><label>疾病方向<select id="resource-disease"><option value="">全部方向</option>{% for disease in resource_diseases %}<option value="{{ disease }}">{{ disease }}</option>{% endfor %}</select></label><button type="reset" class="button outline">重置</button></form>
<div class="resource-count"><p id="result-count" role="status" aria-live="polite">共 {{ resources|length }} 份资料</p><span>按发表年份排列</span></div><div class="resource-grid" id="resource-grid">{% for resource in resources %}{% include "public/resource.html" %}{% endfor %}</div>
<div id="resource-empty" class="empty-state"{% if resources %} hidden{% endif %}><h2>没有找到匹配资料</h2><p>请尝试其他关键词，或清除分类条件。</p><button type="button" class="button outline" id="clear-filters">清除筛选</button></div><noscript><p>筛选功能需要 JavaScript；所有资料均可直接打开。</p></noscript></section>{% endblock %}
