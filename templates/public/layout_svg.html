<svg class="layout-svg" viewBox="0 0 430 {{ layout_height }}" role="img" aria-labelledby="layout-title layout-desc"><title id="layout-title">研究布局示意</title><desc id="layout-desc">{% for row in layout_rows %}{{ row.direction.title }}：{% for cell in row.cells %}{% if cell.on %}{{ cell.name }} {% endif %}{% endfor %}。{% endfor %}</desc>
<g class="layout-columns">{% for column in layout_columns %}<line x1="{{ column.x }}" x2="{{ column.x }}" y1="56" y2="{{ layout_height|add:'-12' }}" class="guide {{ column.key }}"/><rect x="{{ column.x|add:'-25' }}" y="18" width="50" height="28" rx="2" class="layer-pill {{ column.key }}"/><text x="{{ column.x }}" y="37" text-anchor="middle" class="layer-name">{{ column.name }}</text>{% endfor %}</g>
{% for row in layout_rows %}<a href="{{ row.direction.page_name }}" class="layout-link"><rect x="6" y="{{ row.y|add:'-21' }}" width="418" height="42" rx="2" class="row-bg"/><text x="20" y="{{ row.text_y }}" class="row-label">{{ row.direction.label }}</text>{% for cell in row.cells %}{% if cell.on %}<circle cx="{{ cell.x }}" cy="{{ row.y }}" r="8.5" class="dot {{ cell.key }}"/>{% else %}<circle cx="{{ cell.x }}" cy="{{ row.y }}" r="3" class="dot-off"/>{% endif %}{% endfor %}<path d="M404 {{ row.y|add:'-6' }}l6 6-6 6" class="row-arrow"/></a>{% endfor %}</svg>
