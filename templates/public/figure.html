<figure class="figure-plate" id="figure-{{ figure.pk }}"><a class="figure-zoom" href="{{ figure.src }}" data-lightbox target="_blank" rel="noopener"><img src="{{ figure.src }}" alt="{{ figure.alt }}" loading="lazy"><span class="zoom-hint">查看原图</span></a>
{% if not image_only %}<figcaption><p class="figure-tag{% if figure.kind == 'schematic' %} schematic{% endif %}">{% if figure.kind == "schematic" %}示意图{% else %}论文原图{% if figure.label %} · {{ figure.label }}{% endif %}{% endif %}</p>{% if figure.title != figure.label %}<h3>{{ figure.title }}</h3>{% endif %}{% if figure.caption %}<p>{{ figure.caption }}</p>{% endif %}
<p class="figure-source">{% if figure.credit %}<span>出处：<span lang="en">{{ figure.credit }}</span></span>{% endif %}{% if figure.license_note %}<span>{{ figure.license_note }}</span>{% endif %}{% if figure.source_url %}<a href="{{ figure.source_url }}" target="_blank" rel="noopener">原文图页面 ↗</a>{% endif %}</p></figcaption>{% endif %}</figure>
