<article class="project-card" id="project-{{ project.pk }}"><p class="project-program">{{ project.program }}</p><h3>{{ project.title }}</h3><dl><div><dt>项目编号</dt><dd>{{ project.code|default:"—" }}</dd></div><div><dt>项目周期</dt><dd>{{ project.dates }}</dd></div></dl>{% if project.directions.all %}<p class="project-links">相关方向：{% for direction in project.directions.all %}<a href="{{ direction.page_name }}">{{ direction.label }}</a>{% endfor %}</p>{% endif %}</article>
