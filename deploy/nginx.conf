server {
    listen 80;
    server_name 47.119.153.171;
    location ^~ /.well-known/acme-challenge/ { root /var/www/caobin-acme; }
    location / { return 301 https://47.119.153.171$request_uri; }
}

server {
    listen 443 ssl;
    server_name 47.119.153.171;
    ssl_certificate /etc/letsencrypt/live/47.119.153.171/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.119.153.171/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 60m;
    location / {
        proxy_pass http://127.0.0.1:8771;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
