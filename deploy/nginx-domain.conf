# Enable after ICP access is cleared and the domain certificate has been issued.
# Keep deploy/nginx.conf as the separate existing IP virtual host.
server {
    listen 80;
    server_name caobin-lab.com www.caobin-lab.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/caobin-acme; }
    location / { return 301 https://caobin-lab.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.caobin-lab.com;
    ssl_certificate /etc/letsencrypt/live/caobin-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caobin-lab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://caobin-lab.com$request_uri;
}

server {
    listen 443 ssl;
    server_name caobin-lab.com;
    ssl_certificate /etc/letsencrypt/live/caobin-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caobin-lab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 60m;
    location / {
        proxy_pass http://127.0.0.1:8771;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
