<div class="image-upload">
  <div class="photo-preview" data-state="{% if widget.is_initial %}saved{% else %}empty{% endif %}">
    <img alt="当前图片预览" {% if widget.is_initial %}src="{{ widget.value.url }}"{% else %}hidden{% endif %}>
    <p role="status" aria-live="polite">{% if widget.is_initial %}当前图片{% else %}尚未添加图片。{% endif %}</p>
    <button type="button" class="button" hidden>取消新选择</button>
  </div>
  {% if widget.is_initial %}<p class="file-upload"><a data-image-current href="{{ widget.value.url }}" target="_blank" rel="noopener">查看当前原图 ↗</a>
  {% if not widget.required %}<span class="clearable-file-input"><input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}><label for="{{ widget.checkbox_id }}">{{ widget.clear_checkbox_label }}</label></span>{% endif %}</p>{% endif %}
  <p class="image-upload-control"><label for="{{ widget.attrs.id }}">{% if widget.is_initial %}替换图片{% else %}上传图片{% endif %}</label><input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}></p>
  <p class="help">JPG、PNG 或 WebP，最大 10 MB。选择后点击“保存”生效。</p>
</div>
